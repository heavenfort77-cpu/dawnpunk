# Lag fix (Nov 19): REAL frame rates on a real GPU. tools/perfcheck.cjs with GPU=1 on macOS runners (Apple GPU through the VM; Linux runners are software only),
# as a MATRIX: one job per commit x tier x spot, all in parallel (a round takes one job's time). The perfcheck script always comes from main, so older commits
# (a baseline, or each commit of a regression hunt) are measured the same way. Started by tools/gpu_task.sh (or by hand).
# Each job's log prints RENDERER, PERF (draw calls, triangles), FPS (steady frame rate after a settle), BREAK (top 20 by draws and triangles; brk=1),
# PROFILE (top 15 functions by self time over 5 s, night house and boss; prof=1, unminified build) and PASS/FAIL lines.
name: perfgpu
run-name: "perfgpu ${{ inputs.refs }} | ${{ inputs.tiers }} | ${{ inputs.spots }} ${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Runner image"
        type: string
        default: macos-15
      refs:
        description: "Commits or branches to build, comma list (one job per commit x tier x spot)"
        type: string
        default: main
      tiers:
        description: "Tiers, comma list (medium, high, low)"
        type: string
        default: medium
      spots:
        description: "Spots, comma list (flow = title, film, drill, pause, run end; hub, street, house, boss, combat, bosscombat); spots joined with + run in ONE job (same machine, for the night >= hub gate)"
        type: string
        default: hub,street,house,boss
      secs:
        description: "Seconds of steady frames timed per spot"
        type: string
        default: "8"
      settle:
        description: "Seconds drawn first (first-use hitches) per spot"
        type: string
        default: "6"
      brk:
        description: "1 = also print what the draws and triangles are made of"
        type: string
        default: ""
      prof:
        description: "1 = CPU profile (night house, boss) on an unminified build"
        type: string
        default: ""
      tag:
        description: "Free label shown in the run name"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.m.outputs.refs }}
      tiers: ${{ steps.m.outputs.tiers }}
      spots: ${{ steps.m.outputs.spots }}
    steps:
      - id: m
        shell: bash
        env:
          REFS: ${{ inputs.refs }}
          TIERS: ${{ inputs.tiers }}
          SPOTS: ${{ inputs.spots }}
        run: |
          j() { python3 -c 'import json,sys; print(json.dumps([x.strip() for x in sys.argv[1].split(",") if x.strip()]))' "$1"; }
          echo "refs=$(j "$REFS")" >> "$GITHUB_OUTPUT"; echo "tiers=$(j "$TIERS")" >> "$GITHUB_OUTPUT"; echo "spots=$(j "$SPOTS")" >> "$GITHUB_OUTPUT"
  probe:
    needs: plan
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
        tier: ${{ fromJSON(needs.plan.outputs.tiers) }}
        spot: ${{ fromJSON(needs.plan.outputs.spots) }}
    name: "${{ matrix.ref }} ${{ matrix.tier }} ${{ matrix.spot }}"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
      - name: Use main's perfcheck script
        shell: bash
        run: |
          git fetch --depth 1 origin main
          git show FETCH_HEAD:tools/perfcheck.cjs > tools/perfcheck.cjs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Build
        shell: bash
        run: if [ -n "${{ inputs.prof }}" ]; then MINIFY=0 node build.mjs; else node build.mjs; fi
      - run: npm install --no-save --no-audit --no-fund playwright@1.63.0 && npx playwright install chromium
      - name: Measure
        shell: bash
        env:
          GPU: "1"
          SPOTS: ${{ matrix.spot }}
          SECS: ${{ inputs.secs }}
          SETTLE: ${{ inputs.settle }}
          CSECS: "20"
          BREAK: ${{ inputs.brk }}
          PROFILE: ${{ inputs.prof }}
          NOEXTRA: ${{ matrix.spot != 'hub' && '1' || '' }}
        run: |
          echo "JOB ref=${{ matrix.ref }} tier=${{ matrix.tier }} spot=${{ matrix.spot }}"
          # (H) the gates' FAIL lines do not fail the job (exit 1, measurements), a spot that could not run does (exit 3: crashed)
          set +e; node tools/perfcheck.cjs "${{ matrix.tier }}" > perf.log 2>&1; rc=$?; set -e
          grep -E "^JOB|RENDERER|^PERF|^FPS|^PASS|^FAIL|^REPORT|^LEDGER|^BREAK|^PROFILE|^  |^   \\.|^ BY|INFO (dist|cost |.* card (flow|enter) |.*GPU uploads|.*during play|.*downloaded|.*files over|.*title usable|flow|drill on|run end|returning|programs built during.*page errors|Gloom present|boss view|combat)" perf.log || true
          if [ "$rc" = 3 ]; then echo "perfcheck crashed (a spot could not run)"; exit 1; fi
