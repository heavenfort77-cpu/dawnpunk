# The graphics (desktop) checks on GitHub macOS runners, which have a real GPU (Apple, through the VM), instead of Linux's software GPU.
# Same check list (ci/checks.json) and same pass/fail lines; ci/gpu_preload.cjs swaps each check's software-GPU browser flags for Metal.
# Started by hand only. Each job builds dist/ itself.
name: checksmac
run-name: "checksmac ${{ inputs.group }} ${{ inputs.only }} @ ${{ inputs.ref }}"

on:
  workflow_dispatch:
    inputs:
      group:
        description: "all, logic, desktop or phone (desktop is the useful one here)"
        type: string
        default: desktop
      only:
        description: "Comma list of check names (overrides group)"
        type: string
        default: ""
      ref:
        description: "Commit or branch to test"
        type: string
        default: main
      os:
        description: "Runner image"
        type: string
        default: macos-15

permissions:
  contents: read

env:
  PW_VERSION: 1.63.0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.p.outputs.checks }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: p
        run: node ci/ci.mjs plan "${{ inputs.group }}" "${{ inputs.only }}" | grep '^checks=' >> "$GITHUB_OUTPUT"
  check:
    needs: plan
    if: needs.plan.outputs.checks != '[]'
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ matrix.minutes }}
    name: mac ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: GPU preload from main if the tested ref has none
        shell: bash
        run: |
          git fetch -q --depth 1 origin main
          [ -f ci/gpu_preload.cjs ] || git show FETCH_HEAD:ci/gpu_preload.cjs > ci/gpu_preload.cjs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node build.mjs
      - run: npm install --no-save --no-audit --no-fund playwright@${{ env.PW_VERSION }} && npx playwright install chromium
      - name: Run the check on the real GPU
        shell: bash
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/ci/gpu_preload.cjs
        run: |
          set +e
          START=$(date +%s)
          node ci/ci.mjs run "${{ matrix.name }}"; RC=$?
          echo "CHECKTIME ${{ matrix.name }} $(( $(date +%s) - START )) s exit $RC"
          [ -f "ci-logs/${{ matrix.name }}.json" ] && echo "RESULT $(cat ci-logs/${{ matrix.name }}.json)"
          grep -E "FAIL" "ci-logs/${{ matrix.name }}.log" | head -20
          exit $RC
